# resume-lcode 一键部署编排（单容器版本）
# 用法：
#   MYSQL_PASSWORD=xxx docker compose up -d --build   # 构建并后台启动（密码从环境注入）
#   访问：http://localhost:9998 （前端）；后端 API：http://localhost:9999
#   停止：docker compose down
#
# 注意：
#   - 数据现存于外部 MySQL（生产库），容器无状态；请确保容器可访问该 MySQL 并配置好安全组/白名单
#   - MYSQL_PASSWORD 必须通过环境变量注入，切勿写死在本文件提交到 git
#   - 首次部署后请访问 /admin/login 修改默认管理员密码（admin/admin123）
#   - AI 功能需在后台配置真实的 API Endpoint 和 API Key
#   - 生产环境请参考 .env.example 创建 .env 文件

services:
  resume-lcode:
    build: .
    image: resume-lcode:latest
    container_name: resume-lcode
    ports:
      - "9998:80"     # 前端（Nginx 静态页面 + /api 反代）
      - "9999:8080"   # 后端（Spring Boot API）
    # 让容器能通过 host.docker.internal 访问宿主机上的 MySQL（勿用公网 IP 做 hairpin，POST 会卡死）
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - TZ=Asia/Shanghai
      # MySQL 连接：容器内请用 host.docker.internal 或宿主机内网 IP，不要写公网 IP
      - MYSQL_HOST=${MYSQL_HOST:-host.docker.internal}
      - MYSQL_PORT=${MYSQL_PORT:-3306}
      - MYSQL_DB=${MYSQL_DB:-resume-lcode}
      - MYSQL_USER=${MYSQL_USER:-resume-lcode}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:?请通过环境变量提供 MYSQL_PASSWORD}
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-false}
      # 以下变量可通过 .env 文件注入（创建 .env 后生效）
      - RESUME_AI_ENDPOINT=${RESUME_AI_ENDPOINT:-}
      - RESUME_AI_API_KEY=${RESUME_AI_API_KEY:-}
      - RESUME_AI_MODEL=${RESUME_AI_MODEL:-}
      - RESUME_AI_TIMEOUT=${RESUME_AI_TIMEOUT:-15000}
      - RESUME_EVIDENCE_SEARCH_URL=http://evidence-search:8000
      - RESUME_CORS_ORIGINS=${RESUME_CORS_ORIGINS:-http://localhost:9998}
    restart: unless-stopped
    depends_on:
      - evidence-search

  # 向量库不映射宿主机端口；持久化数据在独立卷，不影响现有 MySQL 与配置。
  qdrant:
    image: qdrant/qdrant:v1.15.5
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped

  evidence-search:
    build:
      context: ./search-service
      args:
        # Python 依赖可走宿主机 Mihomo；地址从部署环境注入。
        HTTP_PROXY: ${MIHOMO_PROXY_URL:-}
        HTTPS_PROXY: ${MIHOMO_PROXY_URL:-}
    environment:
      - QDRANT_URL=http://qdrant:6333
      - FASTEMBED_CACHE_PATH=/models
      # 首次获取中文向量模型也走 Mihomo；内网 Qdrant 保持直连。
      - HTTP_PROXY=${MIHOMO_PROXY_URL:-}
      - HTTPS_PROXY=${MIHOMO_PROXY_URL:-}
      - NO_PROXY=qdrant,localhost,127.0.0.1
    volumes:
      - embedding-models:/models
    depends_on:
      - qdrant
    restart: unless-stopped

volumes:
  qdrant-data:
  embedding-models:

